services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GIFT_DB_PATH: /app/state/catalog.db
    volumes:
      - gift_data:/app/state
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  gift_data:
